name: Production CI/CD Pipeline

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: network_assignment

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ecom-app .

      - name: Run Django Health Check
        run: |
          docker run --rm ecom-app python manage.py check

      - name: Tag Docker Image
        run: |
          docker tag ecom-app:latest ${{ steps.login-ecr.outputs.registry }}/network_assignment:prod-latest
          docker tag ecom-app:latest ${{ steps.login-ecr.outputs.registry }}/network_assignment:prod-${{ github.sha }}
